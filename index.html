<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gás &amp; Água</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const LIGHT_COLORS = {
  paper: "#F6F3EC",
  paperDim: "#EFEAE0",
  ink: "#211F1C",
  inkSoft: "#6B6459",
  card: "#FFFFFF",
  border: "#E4DECF",
  primary: "#164A63",
  gas: "#E2572B",
  gasDim: "#F6D9CC",
  agua: "#1F6F8B",
  aguaDim: "#CFE3E9",
  ok: "#4F7942",
  warn: "#B23A2E",
};
const DARK_COLORS = {
  paper: "#12161A",
  paperDim: "#191F24",
  ink: "#ECE9E2",
  inkSoft: "#8A9096",
  card: "#1B2126",
  border: "#2B3339",
  primary: "#3C93B8",
  gas: "#F0743F",
  gasDim: "#3A2721",
  agua: "#4FAAC9",
  aguaDim: "#1C3138",
  ok: "#75B463",
  warn: "#E2645A",
};
let COLORS = { ...LIGHT_COLORS };
const FONT_DISPLAY = "'Bricolage Grotesque', sans-serif";
const FONT_BODY = "'Inter', sans-serif";
const FONT_MONO = "'JetBrains Mono', monospace";

const DEFAULT_AUTH = { username: "Bruno", password: "@Bruno2026" };

// ---------- integração de e-mail (EmailJS) ----------
const EMAILJS = {
  serviceId: "service_00u8v99",
  templateId: "template_7anzuo9",
  publicKey: "Zyl2YjmcydbJ8D2da",
  emailNotificacoes: "clarodeabreu@gmail.com",
};
emailjs.init({ publicKey: EMAILJS.publicKey });

function enviarEmail({ para, assunto, mensagem, codigo }) {
  return emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, {
    to_email: para,
    email: para,
    subject: assunto,
    message: mensagem,
    code: codigo || "",
  }).catch((err) => {
    console.error("Falha ao enviar e-mail:", err);
    throw err;
  });
}
const DEFAULT_ESTOQUE = {
  gas: { nome: "Botijão de Gás (P13)", qtd: 12, capacidade: 40, preco: 110 },
  agua: { nome: "Galão de Água (20L)", qtd: 30, capacidade: 80, preco: 12 },
};

// ---------- armazenamento local (fica só neste aparelho/navegador) ----------
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (err) {
    return fallback;
  }
}
function lsSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {}
}
function lsRemove(key) {
  try {
    localStorage.removeItem(key);
  } catch (err) {}
}

function formatBRL(v) {
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function formatData(iso) {
  const d = new Date(iso);
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}

// ---------- Gauge (elemento assinatura) ----------
function TankGauge({ tipo, qtd, capacidade, color, colorDim, label }) {
  const pct = Math.max(0, Math.min(1, capacidade ? qtd / capacidade : 0));
  const low = pct < 0.2;
  const h = 120;
  const fillH = h * pct;

  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: 16, display: "flex", alignItems: "center", gap: 14, flex: 1, minWidth: 0 }}>
      <svg width="54" height={h} viewBox={`0 0 54 ${h}`} style={{ flexShrink: 0 }}>
        <defs>
          <clipPath id={`clip-${tipo}`}>
            {tipo === "gas" ? (
              <path d="M17,6 h20 v10 c8,4 12,14 12,26 v40 a22,22 0 0 1 -22,22 h0 a22,22 0 0 1 -22,-22 v-40 c0,-12 4,-22 12,-26 z" />
            ) : (
              <path d="M14,4 h26 l6,20 v66 a10,10 0 0 1 -10,10 h-18 a10,10 0 0 1 -10,-10 v-66 z" />
            )}
          </clipPath>
        </defs>
        {tipo === "gas" ? (
          <path d="M17,6 h20 v10 c8,4 12,14 12,26 v40 a22,22 0 0 1 -22,22 h0 a22,22 0 0 1 -22,-22 v-40 c0,-12 4,-22 12,-26 z" fill={colorDim} stroke={color} strokeWidth="2" />
        ) : (
          <path d="M14,4 h26 l6,20 v66 a10,10 0 0 1 -10,10 h-18 a10,10 0 0 1 -10,-10 v-66 z" fill={colorDim} stroke={color} strokeWidth="2" />
        )}
        <g clipPath={`url(#clip-${tipo})`}>
          <rect x="0" y={h - fillH} width="54" height={fillH} fill={low ? COLORS.warn : color} />
        </g>
      </svg>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontFamily: FONT_BODY, fontSize: 12, color: COLORS.inkSoft, fontWeight: 500 }}>{label}</div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 24, fontWeight: 700, color: low ? COLORS.warn : COLORS.ink, lineHeight: 1.1 }}>{qtd}</div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkSoft }}>de {capacidade} un.</div>
        {low && (
          <div style={{ display: "flex", alignItems: "center", gap: 4, marginTop: 4, color: COLORS.warn, fontFamily: FONT_BODY, fontSize: 11, fontWeight: 600 }}>
            ⚠ estoque baixo
          </div>
        )}
      </div>
    </div>
  );
}

const logoTextStyle = (fontSize, marginLeft) => ({
  fontFamily: FONT_DISPLAY,
  fontWeight: 800,
  fontSize,
  marginLeft,
  letterSpacing: "-0.01em",
  backgroundImage: `linear-gradient(90deg, ${COLORS.agua}, ${COLORS.gas})`,
  backgroundClip: "text",
  WebkitBackgroundClip: "text",
  color: "transparent",
  WebkitTextFillColor: "transparent",
});

function LoginScreen({ credenciais, onLogin }) {
  const [etapa, setEtapa] = useState("senha"); // senha | email | codigo
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [verSenha, setVerSenha] = useState(false);
  const [email, setEmail] = useState(EMAILJS.emailNotificacoes);
  const [codigoDigitado, setCodigoDigitado] = useState("");
  const [codigoEnviado, setCodigoEnviado] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const [erro, setErro] = useState("");

  function handleSenha() {
    const u = user.trim();
    const p = pass.trim();
    if (u === credenciais.username && p === credenciais.password) {
      setErro("");
      setEtapa("email");
    } else {
      setErro("Usuário ou senha incorretos.");
    }
  }

  async function handleEnviarCodigo() {
    setErro("");
    const e = email.trim().toLowerCase();
    if (!e.includes("@")) {
      setErro("Digite um e-mail válido.");
      return;
    }
    const codigo = String(Math.floor(100000 + Math.random() * 900000));
    setEnviando(true);
    try {
      await enviarEmail({
        para: e,
        assunto: "Seu código de acesso — Gás & Água",
        mensagem: `Seu código de acesso é: ${codigo}. Ele expira em 10 minutos.`,
        codigo,
      });
      setCodigoEnviado({ codigo, email: e, expira: Date.now() + 10 * 60 * 1000 });
      setEtapa("codigo");
    } catch (err) {
      const detalhe = (err && (err.text || err.message)) ? ` (${err.text || err.message})` : "";
      setErro("Não consegui enviar o e-mail." + detalhe);
    } finally {
      setEnviando(false);
    }
  }

  function handleConfirmarCodigo() {
    if (!codigoEnviado || Date.now() > codigoEnviado.expira) {
      setErro("Código expirado. Envie um novo.");
      return;
    }
    if (codigoDigitado.trim() === codigoEnviado.codigo) {
      onLogin(codigoEnviado.email);
    } else {
      setErro("Código incorreto.");
    }
  }

  return (
    <div style={{ minHeight: "100vh", background: COLORS.paper, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: FONT_BODY }}>
      <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 28 }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: COLORS.gas, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🔥</div>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: COLORS.agua, display: "flex", alignItems: "center", justifyContent: "center", marginLeft: -14, fontSize: 18 }}>💧</div>
        <span style={logoTextStyle(22, 8)}>Gás &amp; Água</span>
      </div>

      <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 16, padding: 28, width: "100%", maxWidth: 340 }}>
        {etapa === "senha" ? (
          <>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15, color: COLORS.ink, marginBottom: 18 }}>Painel administrativo</div>

            <label style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft, display: "block", marginBottom: 6 }}>Usuário</label>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
              <input value={user} onChange={(e) => setUser(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleSenha()}
                autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false"
                style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 14, flex: 1, background: "transparent", color: COLORS.ink, width: "100%" }}
                placeholder="Usuário" />
            </div>

            <label style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft, display: "block", marginBottom: 6 }}>Senha</label>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 6 }}>
              <input type={verSenha ? "text" : "password"} value={pass} onChange={(e) => setPass(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleSenha()}
                autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false"
                style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 14, flex: 1, background: "transparent", color: COLORS.ink, width: "100%" }}
                placeholder="••••" />
              <button type="button" onClick={() => setVerSenha(!verSenha)} style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkSoft, fontSize: 11, fontFamily: FONT_BODY, fontWeight: 600, whiteSpace: "nowrap" }}>
                {verSenha ? "ocultar" : "mostrar"}
              </button>
            </div>

            {erro && <div style={{ color: COLORS.warn, fontSize: 12, marginTop: 8, fontWeight: 500 }}>{erro}</div>}

            <button onClick={handleSenha} style={{ marginTop: 18, width: "100%", background: COLORS.primary, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
              Continuar
            </button>
          </>
        ) : etapa === "email" ? (
          <>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15, color: COLORS.ink, marginBottom: 18 }}>Confirme por e-mail</div>
            <label style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft, display: "block", marginBottom: 6 }}>E-mail</label>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 6 }}>
              <input value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleEnviarCodigo()}
                autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false"
                style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 14, flex: 1, background: "transparent", color: COLORS.ink, width: "100%" }}
                placeholder="seu@email.com" />
            </div>
            {erro && <div style={{ color: COLORS.warn, fontSize: 12, marginTop: 8, fontWeight: 500 }}>{erro}</div>}
            <button onClick={handleEnviarCodigo} disabled={enviando} style={{ marginTop: 18, width: "100%", background: COLORS.primary, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, cursor: enviando ? "default" : "pointer", opacity: enviando ? 0.6 : 1 }}>
              {enviando ? "Enviando…" : "Enviar código"}
            </button>
          </>
        ) : (
          <>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15, color: COLORS.ink, marginBottom: 6 }}>Digite o código</div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 16 }}>Enviamos um código para {codigoEnviado?.email}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 6 }}>
              <input value={codigoDigitado} onChange={(e) => setCodigoDigitado(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleConfirmarCodigo()}
                autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" inputMode="numeric"
                style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 18, letterSpacing: 4, flex: 1, background: "transparent", color: COLORS.ink, width: "100%", textAlign: "center" }}
                placeholder="000000" maxLength={6} />
            </div>
            {erro && <div style={{ color: COLORS.warn, fontSize: 12, marginTop: 8, fontWeight: 500 }}>{erro}</div>}
            <button onClick={handleConfirmarCodigo} style={{ marginTop: 18, width: "100%", background: COLORS.primary, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
              Entrar
            </button>
            <button onClick={() => { setEtapa("email"); setCodigoDigitado(""); setErro(""); }} style={{ marginTop: 10, width: "100%", background: "transparent", color: COLORS.inkSoft, border: "none", padding: "6px 0", fontFamily: FONT_BODY, fontSize: 12, cursor: "pointer" }}>
              Usar outro e-mail
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function ActionButton({ icon, label, onClick, color }) {
  return (
    <button onClick={onClick} style={{ flex: 1, background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: "14px 8px", display: "flex", flexDirection: "column", alignItems: "center", gap: 6, cursor: "pointer", color: color, fontFamily: FONT_BODY, fontSize: 11, fontWeight: 600 }}>
      <span style={{ fontSize: 16 }}>{icon}</span>
      {label}
    </button>
  );
}

function Planilha({ vendas }) {
  const totalGeral = vendas.reduce((s, v) => s + v.total, 0);
  const thStyle = { textAlign: "left", padding: "9px 10px", fontFamily: FONT_BODY, fontSize: 11, fontWeight: 700, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: "0.03em", borderBottom: `2px solid ${COLORS.primary}`, whiteSpace: "nowrap" };
  const tdStyle = { padding: "9px 10px", fontFamily: FONT_MONO, fontSize: 13, color: COLORS.ink, whiteSpace: "nowrap" };

  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, overflow: "hidden" }}>
      <div style={{ padding: "14px 16px 10px", display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14 }}>Planilha de vendas</span>
        <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkSoft }}>{vendas.length} registros · {formatBRL(totalGeral)}</span>
      </div>
      {vendas.length === 0 ? (
        <div style={{ padding: "24px 16px", fontFamily: FONT_BODY, fontSize: 13, color: COLORS.inkSoft }}>Nenhuma venda registrada ainda.</div>
      ) : (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th style={thStyle}>Cliente</th>
                <th style={thStyle}>Gás</th>
                <th style={thStyle}>Água</th>
                <th style={thStyle}>Valor</th>
                <th style={thStyle}>Data</th>
              </tr>
            </thead>
            <tbody>
              {vendas.map((v, i) => {
                const gasVar = v.produto === "gas" ? `-${v.quantidade}` : "0";
                const aguaVar = v.produto === "agua" ? `-${v.quantidade}` : "0";
                const rowBg = i % 2 === 0 ? COLORS.card : COLORS.paperDim;
                return (
                  <tr key={v.id} style={{ background: rowBg }}>
                    <td style={{ ...tdStyle, fontFamily: FONT_BODY, fontWeight: 600 }}>{v.cliente}</td>
                    <td style={{ ...tdStyle, color: v.produto === "gas" ? COLORS.gas : COLORS.inkSoft }}>{gasVar}/{v.estoqueGasApos}</td>
                    <td style={{ ...tdStyle, color: v.produto === "agua" ? COLORS.agua : COLORS.inkSoft }}>{aguaVar}/{v.estoqueAguaApos}</td>
                    <td style={{ ...tdStyle, fontWeight: 700 }}>{formatBRL(v.total)}</td>
                    <td style={{ ...tdStyle, color: COLORS.inkSoft, fontSize: 12 }}>{formatData(v.data)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function Painel({ titulo, onVoltar, children }) {
  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15 }}>{titulo}</span>
        <button onClick={onVoltar} style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkSoft, fontSize: 18 }}>✕</button>
      </div>
      {children}
    </div>
  );
}

function Campo({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>
      <label style={{ fontSize: 11, fontWeight: 600, color: COLORS.inkSoft, display: "block", marginBottom: 6, fontFamily: FONT_BODY }}>{label}</label>
      {children}
    </div>
  );
}

function inputStyle() { return { width: "100%", border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", fontFamily: FONT_MONO, fontSize: 14, outline: "none", color: COLORS.ink, background: COLORS.paper, boxSizing: "border-box" }; }
function confirmBtnStyle() { return { width: "100%", background: COLORS.primary, color: "#fff", border: "none", borderRadius: 10, padding: "13px 0", fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, cursor: "pointer", marginTop: 4 }; }

function NovaVenda({ estoque, onVoltar, onConfirmar }) {
  const [produto, setProduto] = useState("gas");
  const [quantidade, setQuantidade] = useState(1);
  const [cliente, setCliente] = useState("");
  const item = estoque[produto];
  const total = item.preco * quantidade;

  return (
    <Painel titulo="Nova venda" onVoltar={onVoltar}>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {["gas", "agua"].map((p) => (
          <button key={p} onClick={() => setProduto(p)} style={{ flex: 1, padding: "12px 8px", borderRadius: 10, border: `2px solid ${produto === p ? (p === "gas" ? COLORS.gas : COLORS.agua) : COLORS.border}`, background: produto === p ? (p === "gas" ? COLORS.gasDim : COLORS.aguaDim) : COLORS.card, display: "flex", flexDirection: "column", alignItems: "center", gap: 4, cursor: "pointer", fontFamily: FONT_BODY, fontWeight: 600, fontSize: 12, color: COLORS.ink }}>
            <span style={{ fontSize: 16 }}>{p === "gas" ? "🔥" : "💧"}</span>
            {estoque[p].nome}
            <span style={{ fontFamily: FONT_MONO, fontWeight: 400, fontSize: 11, color: COLORS.inkSoft }}>{estoque[p].qtd} em estoque</span>
          </button>
        ))}
      </div>

      <Campo label="Quantidade">
        <input type="number" min={1} value={quantidade} onChange={(e) => setQuantidade(Math.max(1, parseInt(e.target.value) || 1))} style={inputStyle()} />
      </Campo>

      <Campo label="Cliente (opcional)">
        <input value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="Nome do cliente" style={inputStyle()} />
      </Campo>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 0", borderTop: `1px dashed ${COLORS.border}`, marginTop: 6 }}>
        <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: COLORS.inkSoft, fontWeight: 500 }}>Total</span>
        <span style={{ fontFamily: FONT_MONO, fontSize: 22, fontWeight: 700 }}>{formatBRL(total)}</span>
      </div>

      <button onClick={() => { const ok = onConfirmar({ produto, quantidade, cliente }); if (ok) onVoltar(); }} style={confirmBtnStyle()}>
        Confirmar venda
      </button>
    </Painel>
  );
}

function RepoEstoque({ estoque, onVoltar, onRepor }) {
  const [produto, setProduto] = useState("gas");
  const [quantidade, setQuantidade] = useState(10);

  return (
    <Painel titulo="Repor estoque" onVoltar={onVoltar}>
      <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        {["gas", "agua"].map((p) => (
          <button key={p} onClick={() => setProduto(p)} style={{ flex: 1, padding: "12px 8px", borderRadius: 10, border: `2px solid ${produto === p ? (p === "gas" ? COLORS.gas : COLORS.agua) : COLORS.border}`, background: produto === p ? (p === "gas" ? COLORS.gasDim : COLORS.aguaDim) : COLORS.card, cursor: "pointer", fontFamily: FONT_BODY, fontWeight: 600, fontSize: 12, color: COLORS.ink }}>
            {estoque[p].nome}
          </button>
        ))}
      </div>

      <Campo label="Quantidade a adicionar">
        <input type="number" min={1} value={quantidade} onChange={(e) => setQuantidade(Math.max(1, parseInt(e.target.value) || 1))} style={inputStyle()} />
      </Campo>

      <button onClick={() => { onRepor(produto, quantidade); onVoltar(); }} style={confirmBtnStyle()}>
        Adicionar ao estoque
      </button>
    </Painel>
  );
}

function Configuracoes({ credenciais, estoque, onVoltar, onSalvarConta, onSalvarEstoque }) {
  const [sub, setSub] = useState("menu"); // menu | conta | suporte | estoque

  if (sub === "conta") {
    return <AlterarConta credenciais={credenciais} onVoltar={() => setSub("menu")} onSalvar={onSalvarConta} />;
  }
  if (sub === "suporte") {
    return <Suporte onVoltar={() => setSub("menu")} />;
  }
  if (sub === "estoque") {
    return <AlterarEstoque estoque={estoque} onVoltar={() => setSub("menu")} onSalvar={onSalvarEstoque} />;
  }

  return (
    <Painel titulo="Configurações" onVoltar={onVoltar}>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <button onClick={() => setSub("conta")} style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left", background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: "14px 16px", cursor: "pointer" }}>
          <span style={{ fontSize: 18 }}>🔐</span>
          <div>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, color: COLORS.ink }}>Alterar usuário e senha</div>
            <div style={{ fontFamily: FONT_BODY, fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>Trocar os dados de acesso ao painel</div>
          </div>
        </button>
        <button onClick={() => setSub("estoque")} style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left", background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: "14px 16px", cursor: "pointer" }}>
          <span style={{ fontSize: 18 }}>📦</span>
          <div>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, color: COLORS.ink }}>Alterar estoque</div>
            <div style={{ fontFamily: FONT_BODY, fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>Ajustar quantidade, capacidade e preço do gás e da água</div>
          </div>
        </button>
        <button onClick={() => setSub("suporte")} style={{ display: "flex", alignItems: "center", gap: 12, textAlign: "left", background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: "14px 16px", cursor: "pointer" }}>
          <span style={{ fontSize: 18 }}>💬</span>
          <div>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, color: COLORS.ink }}>Falar com o suporte</div>
            <div style={{ fontFamily: FONT_BODY, fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>Relatar um problema por e-mail</div>
          </div>
        </button>
      </div>
    </Painel>
  );
}

function AlterarEstoque({ estoque, onVoltar, onSalvar }) {
  const [gas, setGas] = useState({ qtd: estoque.gas.qtd, capacidade: estoque.gas.capacidade, preco: estoque.gas.preco });
  const [agua, setAgua] = useState({ qtd: estoque.agua.qtd, capacidade: estoque.agua.capacidade, preco: estoque.agua.preco });
  const [ok, setOk] = useState(false);

  function campoNumero(valor, setFn, campo, min = 0) {
    return (
      <input
        type="number"
        min={min}
        value={valor}
        onChange={(e) => setFn((prev) => ({ ...prev, [campo]: Math.max(min, parseFloat(e.target.value) || 0) }))}
        style={inputStyle()}
      />
    );
  }

  function handleSalvar() {
    onSalvar({
      gas: { ...estoque.gas, qtd: gas.qtd, capacidade: gas.capacidade, preco: gas.preco },
      agua: { ...estoque.agua, qtd: agua.qtd, capacidade: agua.capacidade, preco: agua.preco },
    });
    setOk(true);
    setTimeout(() => setOk(false), 2000);
  }

  return (
    <Painel titulo="Alterar estoque" onVoltar={onVoltar}>
      <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 13, color: COLORS.gas, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
        🔥 {estoque.gas.nome}
      </div>
      <Campo label="Quantidade em estoque">{campoNumero(gas.qtd, setGas, "qtd")}</Campo>
      <Campo label="Capacidade máxima">{campoNumero(gas.capacidade, setGas, "capacidade", 1)}</Campo>
      <Campo label="Preço unitário (R$)">{campoNumero(gas.preco, setGas, "preco", 0)}</Campo>

      <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 13, color: COLORS.agua, marginTop: 8, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
        💧 {estoque.agua.nome}
      </div>
      <Campo label="Quantidade em estoque">{campoNumero(agua.qtd, setAgua, "qtd")}</Campo>
      <Campo label="Capacidade máxima">{campoNumero(agua.capacidade, setAgua, "capacidade", 1)}</Campo>
      <Campo label="Preço unitário (R$)">{campoNumero(agua.preco, setAgua, "preco", 0)}</Campo>

      {ok && <div style={{ color: COLORS.ok, fontSize: 12, marginBottom: 10, fontWeight: 500 }}>Estoque atualizado com sucesso.</div>}

      <button onClick={handleSalvar} style={confirmBtnStyle()}>Salvar alterações</button>
    </Painel>
  );
}

function AlterarConta({ credenciais, onVoltar, onSalvar }) {
  const [user, setUser] = useState(credenciais.username);
  const [pass, setPass] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [verSenha, setVerSenha] = useState(false);
  const [erro, setErro] = useState("");
  const [ok, setOk] = useState(false);

  function handleSalvar() {
    const u = user.trim();
    const p = pass.trim();
    const c = confirmar.trim();
    if (!u) { setErro("Digite um usuário."); return; }
    if (!p) { setErro("Digite uma senha."); return; }
    if (p !== c) { setErro("As senhas não coincidem."); return; }
    onSalvar({ username: u, password: p });
    setErro("");
    setOk(true);
    setTimeout(() => setOk(false), 2000);
  }

  return (
    <Painel titulo="Alterar usuário e senha" onVoltar={onVoltar}>
      <Campo label="Usuário">
        <input value={user} onChange={(e) => setUser(e.target.value)} style={inputStyle()} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
      </Campo>
      <Campo label="Nova senha">
        <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px" }}>
          <input type={verSenha ? "text" : "password"} value={pass} onChange={(e) => setPass(e.target.value)}
            style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 14, flex: 1, background: "transparent", color: COLORS.ink, width: "100%" }}
            autoCapitalize="off" autoCorrect="off" spellCheck="false" />
          <button type="button" onClick={() => setVerSenha(!verSenha)} style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkSoft, fontSize: 11, fontFamily: FONT_BODY, fontWeight: 600, whiteSpace: "nowrap" }}>
            {verSenha ? "ocultar" : "mostrar"}
          </button>
        </div>
      </Campo>
      <Campo label="Confirmar nova senha">
        <input type={verSenha ? "text" : "password"} value={confirmar} onChange={(e) => setConfirmar(e.target.value)} style={inputStyle()} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
      </Campo>

      {erro && <div style={{ color: COLORS.warn, fontSize: 12, marginBottom: 10, fontWeight: 500 }}>{erro}</div>}
      {ok && <div style={{ color: COLORS.ok, fontSize: 12, marginBottom: 10, fontWeight: 500 }}>Dados atualizados com sucesso.</div>}

      <button onClick={handleSalvar} style={confirmBtnStyle()}>Salvar alterações</button>
    </Painel>
  );
}

function Suporte({ onVoltar }) {
  const [mensagem, setMensagem] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [erro, setErro] = useState("");
  const [enviado, setEnviado] = useState(false);

  async function handleEnviar() {
    const m = mensagem.trim();
    if (!m) { setErro("Descreva o problema antes de enviar."); return; }
    setErro("");
    setEnviando(true);
    try {
      await enviarEmail({
        para: EMAILJS.emailNotificacoes,
        assunto: "Suporte — Sistema Gás & Água",
        mensagem: m,
      });
      setEnviado(true);
      setMensagem("");
    } catch (err) {
      const detalhe = (err && (err.text || err.message)) ? ` (${err.text || err.message})` : "";
      setErro("Não consegui enviar." + detalhe);
    } finally {
      setEnviando(false);
    }
  }

  if (enviado) {
    return (
      <Painel titulo="Falar com o suporte" onVoltar={onVoltar}>
        <div style={{ textAlign: "center", padding: "20px 0" }}>
          <div style={{ fontSize: 32, marginBottom: 10 }}>✅</div>
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15, color: COLORS.ink, marginBottom: 6 }}>Mensagem enviada</div>
          <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: COLORS.inkSoft }}>Seu relato foi enviado para o suporte.</div>
        </div>
        <button onClick={() => setEnviado(false)} style={confirmBtnStyle()}>Enviar outro problema</button>
      </Painel>
    );
  }

  return (
    <Painel titulo="Falar com o suporte" onVoltar={onVoltar}>
      <Campo label="Descreva o problema">
        <textarea value={mensagem} onChange={(e) => setMensagem(e.target.value)} rows={6} placeholder="Conte o que aconteceu..."
          style={{ ...inputStyle(), fontFamily: FONT_BODY, resize: "vertical" }} />
      </Campo>
      {erro && <div style={{ color: COLORS.warn, fontSize: 12, marginBottom: 10, fontWeight: 500 }}>{erro}</div>}
      <button onClick={handleEnviar} disabled={enviando} style={{ ...confirmBtnStyle(), opacity: enviando ? 0.6 : 1, cursor: enviando ? "default" : "pointer" }}>
        {enviando ? "Enviando…" : "Enviar para o suporte"}
      </button>
    </Painel>
  );
}

function App() {
  const [modoEscuro, setModoEscuro] = useState(() => lsGet("gas-agua-tema", false));
  Object.assign(COLORS, modoEscuro ? DARK_COLORS : LIGHT_COLORS);

  function alternarTema() {
    const novo = !modoEscuro;
    setModoEscuro(novo);
    lsSet("gas-agua-tema", novo);
  }

  const [logado, setLogado] = useState(() => !!lsGet("gas-agua-sessao", null));
  const [emailLogado, setEmailLogado] = useState(() => {
    const s = lsGet("gas-agua-sessao", null);
    return s ? s.email : null;
  });
  const [credenciais, setCredenciais] = useState(() => lsGet("gas-agua-auth", DEFAULT_AUTH));
  const [estoque, setEstoque] = useState(() => lsGet("gas-agua-estoque", DEFAULT_ESTOQUE));
  const [vendas, setVendas] = useState(() => lsGet("gas-agua-vendas", []));
  const [tela, setTela] = useState("historico");
  const [toast, setToast] = useState(null);
  const [enviandoRelatorio, setEnviandoRelatorio] = useState(false);

  useEffect(() => { lsSet("gas-agua-auth", credenciais); }, []);

  function salvarCredenciais(novas) { setCredenciais(novas); lsSet("gas-agua-auth", novas); }
  function salvarEstoque(novo) { setEstoque(novo); lsSet("gas-agua-estoque", novo); }
  function salvarVendas(novo) { setVendas(novo); lsSet("gas-agua-vendas", novo); }

  function mostrarToast(msg, tipo = "ok") {
    setToast({ msg, tipo });
    setTimeout(() => setToast(null), 2500);
  }

  function registrarVenda({ produto, quantidade, cliente }) {
    const item = estoque[produto];
    if (quantidade > item.qtd) {
      mostrarToast("Estoque insuficiente para essa venda.", "warn");
      return false;
    }
    const total = quantidade * item.preco;
    const estoqueResultante = { ...estoque, [produto]: { ...item, qtd: item.qtd - quantidade } };
    const nova = {
      id: Date.now(),
      produto,
      nomeProduto: item.nome,
      quantidade,
      valorUnit: item.preco,
      total,
      cliente: cliente || "—",
      data: new Date().toISOString(),
      estoqueGasApos: estoqueResultante.gas.qtd,
      estoqueAguaApos: estoqueResultante.agua.qtd,
    };
    salvarVendas([nova, ...vendas]);
    salvarEstoque(estoqueResultante);
    mostrarToast(`Venda registrada: ${formatBRL(total)}`, "ok");

    enviarEmail({
      para: EMAILJS.emailNotificacoes,
      assunto: `Nova venda — ${nova.nomeProduto}`,
      mensagem: `Cliente: ${nova.cliente}\nProduto: ${nova.nomeProduto}\nQuantidade: ${nova.quantidade}\nValor: ${formatBRL(nova.total)}\nEstoque restante — Gás: ${nova.estoqueGasApos} · Água: ${nova.estoqueAguaApos}\nData: ${formatData(nova.data)}`,
    }).catch(() => {});

    return true;
  }

  function reporEstoque(produto, quantidade) {
    const item = estoque[produto];
    salvarEstoque({ ...estoque, [produto]: { ...item, qtd: item.qtd + quantidade } });
    mostrarToast("Estoque atualizado.", "ok");
  }

  async function enviarRelatorioDiario(vendasHojeParam, faturamentoHojeParam) {
    setEnviandoRelatorio(true);
    const linhas = vendasHojeParam
      .map((v) => `${v.cliente} — ${v.nomeProduto} × ${v.quantidade} — ${formatBRL(v.total)}`)
      .join("\n");
    try {
      await enviarEmail({
        para: EMAILJS.emailNotificacoes,
        assunto: `Relatório diário — ${new Date().toLocaleDateString("pt-BR")}`,
        mensagem: `Vendas de hoje: ${vendasHojeParam.length}\nFaturamento: ${formatBRL(faturamentoHojeParam)}\n\n${linhas || "Nenhuma venda registrada hoje."}\n\nEstoque atual — Gás: ${estoque.gas.qtd} · Água: ${estoque.agua.qtd}`,
      });
      mostrarToast("Relatório enviado por e-mail.", "ok");
    } catch (err) {
      mostrarToast("Não consegui enviar o relatório.", "warn");
    } finally {
      setEnviandoRelatorio(false);
    }
  }

  if (!logado) {
    return <LoginScreen credenciais={credenciais} onLogin={(email) => { setEmailLogado(email); setLogado(true); lsSet("gas-agua-sessao", { email, desde: new Date().toISOString() }); }} />;
  }

  const hoje = new Date().toDateString();
  const vendasHoje = vendas.filter((v) => new Date(v.data).toDateString() === hoje);
  const faturamentoHoje = vendasHoje.reduce((s, v) => s + v.total, 0);

  return (
    <div style={{ minHeight: "100vh", background: COLORS.paper, fontFamily: FONT_BODY, color: COLORS.ink, paddingBottom: 90 }}>
      <div style={{ padding: "18px 18px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `2px solid ${COLORS.agua}`, background: `linear-gradient(90deg, ${COLORS.aguaDim} 0%, ${COLORS.paper} 40%)` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: COLORS.gas, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>🔥</div>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: COLORS.agua, display: "flex", alignItems: "center", justifyContent: "center", marginLeft: -10, fontSize: 14 }}>💧</div>
          <span style={logoTextStyle(17, 6)}>Gás &amp; Água</span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={alternarTema} style={{ background: "transparent", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "6px 10px", display: "flex", alignItems: "center", gap: 6, cursor: "pointer", color: COLORS.inkSoft, fontSize: 14 }}>
            {modoEscuro ? "☀️" : "🌙"}
          </button>
          <button onClick={() => setTela("config")} style={{ background: "transparent", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "6px 10px", display: "flex", alignItems: "center", gap: 6, cursor: "pointer", color: COLORS.inkSoft, fontSize: 14 }}>
            ⚙️
          </button>
          <button onClick={() => { setLogado(false); setEmailLogado(null); lsRemove("gas-agua-sessao"); }} style={{ background: "transparent", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "6px 10px", display: "flex", alignItems: "center", gap: 6, cursor: "pointer", color: COLORS.inkSoft, fontSize: 12, fontFamily: FONT_BODY, fontWeight: 500 }}>
            Sair
          </button>
        </div>
      </div>

      <div style={{ padding: 18, display: "flex", flexDirection: "column", gap: 18 }}>
        <div style={{ display: "flex", gap: 12 }}>
          <TankGauge tipo="gas" qtd={estoque.gas.qtd} capacidade={estoque.gas.capacidade} color={COLORS.gas} colorDim={COLORS.gasDim} label="Gás" />
          <TankGauge tipo="agua" qtd={estoque.agua.qtd} capacidade={estoque.agua.capacidade} color={COLORS.agua} colorDim={COLORS.aguaDim} label="Água" />
        </div>

        <div style={{ background: COLORS.primary, borderRadius: 14, padding: "16px 18px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ color: "#B8B2A4", fontSize: 11, fontFamily: FONT_BODY, fontWeight: 500 }}>FATURAMENTO HOJE</div>
            <div style={{ color: "#fff", fontFamily: FONT_MONO, fontSize: 26, fontWeight: 700 }}>{formatBRL(faturamentoHoje)}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ color: "#B8B2A4", fontSize: 11, fontFamily: FONT_BODY, fontWeight: 500 }}>VENDAS HOJE</div>
            <div style={{ color: "#fff", fontFamily: FONT_MONO, fontSize: 26, fontWeight: 700 }}>{vendasHoje.length}</div>
          </div>
        </div>

        <button
          onClick={() => enviarRelatorioDiario(vendasHoje, faturamentoHoje)}
          disabled={enviandoRelatorio}
          style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 0", fontFamily: FONT_BODY, fontWeight: 600, fontSize: 12, color: COLORS.inkSoft, cursor: enviandoRelatorio ? "default" : "pointer", opacity: enviandoRelatorio ? 0.6 : 1 }}
        >
          {enviandoRelatorio ? "Enviando…" : "📧 Enviar relatório do dia por e-mail"}
        </button>

        {tela === "historico" && (
          <>
            <div style={{ display: "flex", gap: 10 }}>
              <ActionButton icon="➕" label="Nova venda" onClick={() => setTela("nova-venda")} color={COLORS.gas} />
              <ActionButton icon="📦" label="Repor estoque" onClick={() => setTela("estoque")} color={COLORS.agua} />
            </div>
            <Planilha vendas={vendas} />
          </>
        )}

        {tela === "nova-venda" && <NovaVenda estoque={estoque} onVoltar={() => setTela("historico")} onConfirmar={registrarVenda} />}
        {tela === "estoque" && <RepoEstoque estoque={estoque} onVoltar={() => setTela("historico")} onRepor={reporEstoque} />}
        {tela === "config" && <Configuracoes credenciais={credenciais} estoque={estoque} onVoltar={() => setTela("historico")} onSalvarConta={salvarCredenciais} onSalvarEstoque={salvarEstoque} />}
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: 18, right: 18, background: toast.tipo === "warn" ? COLORS.warn : COLORS.ok, color: "#fff", borderRadius: 10, padding: "12px 14px", display: "flex", alignItems: "center", gap: 8, fontFamily: FONT_BODY, fontSize: 13, fontWeight: 500, boxShadow: "0 8px 24px rgba(0,0,0,0.18)" }}>
          {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
