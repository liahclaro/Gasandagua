  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-8px); }

  }

  ink: "#ECE9E2",
  inkSoft: "#8A9096",
  card: "#1B2126",
  border: "#2B3339",

const DEFAULT_AUTH = { username: "Bruno", password: "@Bruno2026" };

// ---------- integração de e-mail (EmailJS) ----------
const EMAILJS = {
  serviceId: "service_00u8v99",

  publicKey: "Zyl2YjmcydbJ8D2da",
  emailNotificacoes: "clarodeabreu@gmail.com",
};
emailjs.init({ publicKey: EMAILJS.publicKey });

function enviarEmail({ para, assunto, mensagem, codigo }) {
  return emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, {

// ---------- notificação push (ntfy) ----------
// 1. Instale o app "ntfy" (Android/iOS) ou abra <SEU_SERVIDOR>/gas-pedidos-8k2m9x no navegador.
// 2. Toque em "Inscrever-se" (Subscribe) nesse tópico.
// 3. Pronto: toda vez que um cliente fizer um pedido, você recebe a notificação no celular,
//    mesmo com o app fechado.
//
// SERVIDOR:
// - Padrão: usa o servidor público https://ntfy.sh (grátis, mas o tópico funciona como
//   uma "senha" simples — quem souber o nome consegue ler as notificações).
// - Para usar seu próprio servidor (mais privado), rode o ntfy em uma VPS/Raspberry Pi, por ex:
//     docker run -p 80:80 -it binwiederhier/ntfy serve
//   e troque NTFY_SERVER abaixo pela URL dele (ex: "https://ntfy.meudominio.com" ou
//   "http://SEU_IP:PORTA"). No app ntfy do celular, também é preciso trocar o servidor
//   nas configurações (Settings → Default server) para o mesmo endereço.
const NTFY_SERVER = "https://ntfy.sh";
const NTFY_TOPIC = "gas-pedidos-8k2m9x"; // troque por algo só seu, aleatório

function enviarNtfy({ titulo, mensagem, prioridade = "default", tags = "fire" }) {
  return fetch(`${NTFY_SERVER.replace(/\/$/, "")}/${NTFY_TOPIC}`, {
    method: "POST",
    headers: {
      "Title": titulo,
      "Priority": prioridade,
      "Tags": tags,
    },
    body: mensagem,
  }).catch((err) => {
    console.error("Falha ao enviar notificação ntfy:", err);
  });
}

const DEFAULT_ESTOQUE = {
  gas: { nome: "Botijão de Gás (P13)", qtd: 12, capacidade: 40, preco: 110 },
};

// ---------- tipos de gás disponíveis para pedido do cliente ----------
// Ajuste nome/descrição/preço conforme o que você realmente vende.
const TIPOS_GAS = [
  { id: "completo", nome: "Gás Completo", desc: "Botijão P13 cheio", preco: 110, icone: "🔥" },
  { id: "meiota", nome: "Gás Meiota", desc: "Botijão P8 (meio)", preco: 70, icone: "🔥" },
  { id: "povo", nome: "Gás do Povo", desc: "Botijão P5 (popular)", preco: 45, icone: "🔥" },
];

// ---------- cupons de desconto do pedido do cliente ----------
// Ajuste os códigos e valores conforme as promoções que você quiser rodar.
const CUPONS = {
  GAS10: { tipo: "percentual", valor: 10, descricao: "10% de desconto" },
  BEMVINDO: { tipo: "fixo", valor: 10, descricao: "R$ 10 de desconto" },
};

// ---------- formas de pagamento disponíveis para o cliente escolher ----------
const FORMAS_PAGAMENTO = [
  { id: "pix", nome: "Pix", icone: "📱" },
  { id: "debito", nome: "Cartão de débito", icone: "💳" },
  { id: "credito", nome: "Cartão de crédito", icone: "💳" },
  { id: "dinheiro", nome: "Dinheiro", icone: "💵" },
];

// ---------- armazenamento local (fica só neste aparelho/navegador) ----------
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (err) {
    return fallback;
  }
}
function lsSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {}
}
function lsRemove(key) {
  try {
    localStorage.removeItem(key);
  } catch (err) {}
}

function formatBRL(v) {
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function formatData(iso) {
  const d = new Date(iso);
  return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function dentroDoPeriodo(iso, periodo) {
  if (periodo === "tudo") return true;
  const dias = periodo === "hoje" ? 1 : periodo === "7d" ? 7 : 30;
  const limite = Date.now() - dias * 24 * 60 * 60 * 1000;
  if (periodo === "hoje") {
    return new Date(iso).toDateString() === new Date().toDateString();
  }
  return new Date(iso).getTime() >= limite;
}

// ---------- Gauge (elemento assinatura) ----------
function TankGauge({ qtd, capacidade, color, colorDim, label }) {
  const pct = Math.max(0, Math.min(1, capacidade ? qtd / capacidade : 0));
  const low = pct < 0.2;
  const h = 120;
  const fillH = h * pct;
  const shape = "M17,6 h20 v10 c8,4 12,14 12,26 v40 a22,22 0 0 1 -22,22 h0 a22,22 0 0 1 -22,-22 v-40 c0,-12 4,-22 12,-26 z";

  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: 16, display: "flex", alignItems: "center", gap: 14, flex: 1, minWidth: 0 }}>
      <svg width="54" height={h} viewBox={`0 0 54 ${h}`} style={{ flexShrink: 0 }}>
        <defs>
          <clipPath id="clip-gas">
            <path d={shape} />
          </clipPath>
        </defs>
        <path d={shape} fill={colorDim} stroke={color} strokeWidth="2" />
        <g clipPath="url(#clip-gas)" className={pct > 0 ? "liquid-wobble" : ""}>
          <rect className="tank-fill" x="0" y={h - fillH} width="54" height={fillH} fill={low ? COLORS.warn : color} />
        </g>
      </svg>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontFamily: FONT_BODY, fontSize: 12, color: COLORS.inkSoft, fontWeight: 500 }}>{label}</div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 24, fontWeight: 700, color: low ? COLORS.warn : COLORS.ink, lineHeight: 1.1, transition: "color 0.4s ease" }}>{qtd}</div>
        <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkSoft }}>de {capacidade} un.</div>
        {low && (
          <div className="fade-in" style={{ display: "flex", alignItems: "center", gap: 4, marginTop: 4, color: COLORS.warn, fontFamily: FONT_BODY, fontSize: 11, fontWeight: 600 }}>
            <span className="pulse-warn">⚠</span> estoque baixo
          </div>
        )}
      </div>
    </div>
  );
}

function useCountUp(valor, duracaoMs = 600) {
  const [exibido, setExibido] = React.useState(valor);
  React.useEffect(() => {
    const inicio = exibido;
    const diff = valor - inicio;
    if (diff === 0) return;
    const t0 = performance.now();
    let raf;
    function passo(t) {
      const p = Math.min(1, (t - t0) / duracaoMs);
      const ease = 1 - Math.pow(1 - p, 3);
      setExibido(inicio + diff * ease);
      if (p < 1) raf = requestAnimationFrame(passo);
    }
    raf = requestAnimationFrame(passo);
    return () => cancelAnimationFrame(raf);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [valor]);
  return exibido;
}

const logoTextStyle = (fontSize, marginLeft) => ({
  fontFamily: FONT_DISPLAY,
  fontWeight: 800,
  fontSize,
  marginLeft,
  letterSpacing: "-0.01em",
  backgroundImage: `linear-gradient(90deg, ${COLORS.primary}, ${COLORS.gas})`,
  backgroundClip: "text",
  WebkitBackgroundClip: "text",
  color: "transparent",
  WebkitTextFillColor: "transparent",
});

function ClienteScreen({ onVoltar, onNovoPedido }) {
  const perfilSalvo = lsGet("gas-agua-cliente-perfil", { nome: "", telefone: "", endereco: "" });
  const [nome, setNome] = useState(perfilSalvo.nome || "");
  const [telefone, setTelefone] = useState(perfilSalvo.telefone || "");
  const [endereco, setEndereco] = useState(perfilSalvo.endereco || "");
  const [tipo, setTipo] = useState(TIPOS_GAS[0].id);
  const [quantidade, setQuantidade] = useState(1);
  const [observacoes, setObservacoes] = useState("");
  const [cupomInput, setCupomInput] = useState("");
  const [cupomAplicado, setCupomAplicado] = useState(null);
  const [erroCupom, setErroCupom] = useState("");
  const [pagamento, setPagamento] = useState(FORMAS_PAGAMENTO[0].id);
  const [erro, setErro] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [enviado, setEnviado] = useState(false);
  const [ultimoPedido, setUltimoPedido] = useState(null);

  const tipoSelecionado = TIPOS_GAS.find((t) => t.id === tipo);
  const subtotal = tipoSelecionado.preco * quantidade;
  const desconto = cupomAplicado
    ? Math.min(subtotal, cupomAplicado.tipo === "percentual" ? subtotal * (cupomAplicado.valor / 100) : cupomAplicado.valor)
    : 0;
  const total = Math.max(0, subtotal - desconto);

  function aplicarCupom() {
    const codigo = cupomInput.trim().toUpperCase();
    if (!codigo) { setErroCupom("Digite um código de cupom."); return; }
    const c = CUPONS[codigo];
    if (!c) { setErroCupom("Cupom inválido."); setCupomAplicado(null); return; }
    setErroCupom("");
    setCupomAplicado({ codigo, ...c });
  }

  function removerCupom() {
    setCupomAplicado(null);
    setCupomInput("");
    setErroCupom("");
  }

  function resetarParaNovoPedido() {
    setQuantidade(1);
    setObservacoes("");
    removerCupom();
    setErro("");
    setEnviado(false);
  }

  async function handleEnviar() {
    const n = nome.trim();
    const tel = telefone.trim();
    if (!n) { setErro("Digite seu nome."); return; }
    if (!tel) { setErro("Digite um telefone para contato."); return; }
    setErro("");
    setEnviando(true);

    const enderecoLimpo = endereco.trim();
    lsSet("gas-agua-cliente-perfil", { nome: n, telefone: tel, endereco: enderecoLimpo });

    const formaPagamentoSelecionada = FORMAS_PAGAMENTO.find((f) => f.id === pagamento);

    const dados = {
      nome: n,
      telefone: tel,
      endereco: enderecoLimpo,
      tipo,
      tipoNome: tipoSelecionado.nome,
      quantidade,
      subtotal,
      cupom: cupomAplicado ? cupomAplicado.codigo : null,
      desconto,
      total,
      pagamento,
      pagamentoNome: formaPagamentoSelecionada.nome,
      observacoes: observacoes.trim(),
    };

    if (onNovoPedido) onNovoPedido(dados);
    setUltimoPedido(dados);

    enviarEmail({
      para: EMAILJS.emailNotificacoes,
      assunto: `Novo pedido — ${tipoSelecionado.nome}`,
      mensagem: `Novo pedido feito pelo cliente:\n\nNome: ${n}\nTelefone: ${tel}\nEndereço: ${dados.endereco || "—"}\n\nProduto: ${tipoSelecionado.nome} (${tipoSelecionado.desc})\nQuantidade: ${quantidade}\nSubtotal: ${formatBRL(subtotal)}\nCupom: ${dados.cupom ? `${dados.cupom} (-${formatBRL(desconto)})` : "—"}\nTotal: ${formatBRL(total)}\nPagamento: ${formaPagamentoSelecionada.nome}\n\nObservações: ${dados.observacoes || "—"}\n\nData: ${formatData(new Date().toISOString())}`,
    }).catch(() => {});

    enviarNtfy({
      titulo: `Novo pedido — ${tipoSelecionado.nome}`,
      mensagem: `${n} (${tel}) — ${quantidade}x ${tipoSelecionado.nome} — ${formatBRL(total)} — ${formaPagamentoSelecionada.nome}`,
      tags: "fire,moneybag",
    });

    setEnviando(false);
    setEnviado(true);
  }

  if (enviado) {
    return (
      <div style={{ minHeight: "100vh", background: "#000000", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: FONT_BODY }}>
        <div className="fade-in" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 16, padding: 28, width: "100%", maxWidth: 340, textAlign: "center" }}>
          <div className="check-pop" style={{ fontSize: 36, marginBottom: 12 }}>✅</div>
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 16, color: COLORS.ink, marginBottom: 6 }}>Pedido enviado!</div>
          <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: COLORS.inkSoft, marginBottom: 20 }}>
            Recebemos seu pedido de {ultimoPedido ? ultimoPedido.tipoNome.toLowerCase() : tipoSelecionado.nome.toLowerCase()}
            {ultimoPedido ? ` (pagamento: ${ultimoPedido.pagamentoNome})` : ""}. Em breve entraremos em contato.
          </div>
          <button className="btn-anim btn-lift" onClick={resetarParaNovoPedido} style={confirmBtnStyle()}>🔁 Fazer novo pedido</button>
          <button className="btn-anim" onClick={onVoltar} style={{ marginTop: 10, width: "100%", background: "transparent", color: COLORS.inkSoft, border: "none", padding: "6px 0", fontFamily: FONT_BODY, fontSize: 12, cursor: "pointer" }}>
            ← Voltar
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", background: "#000000", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: FONT_BODY }}>
      <div className="scale-in" style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 22 }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: COLORS.gas, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🔥</div>
        <span style={logoTextStyle(22, 10)}>Gás</span>
      </div>

      <div className="fade-in screen-enter" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 16, padding: 26, width: "100%", maxWidth: 360 }}>
        <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 16, color: COLORS.ink, marginBottom: 4 }}>Fazer pedido</div>
        <div style={{ fontFamily: FONT_BODY, fontSize: 12, color: COLORS.inkSoft, marginBottom: 18 }}>Escolha o tipo de gás e preencha seus dados.</div>

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
          {TIPOS_GAS.map((t) => {
            const ativo = t.id === tipo;
            return (
              <button
                key={t.id}
                type="button"
                className="btn-anim"
                onClick={() => setTipo(t.id)}
                style={{
                  display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10,
                  textAlign: "left", cursor: "pointer",
                  border: `2px solid ${ativo ? COLORS.gas : COLORS.border}`,
                  background: ativo ? COLORS.gasDim : "transparent",
                  borderRadius: 12, padding: "12px 14px",
                }}
              >
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 18 }}>{t.icone}</span>
                  <div>
                    <div style={{ fontFamily: FONT_BODY, fontWeight: 600, fontSize: 13, color: COLORS.ink }}>{t.nome}</div>
                    <div style={{ fontFamily: FONT_BODY, fontSize: 11, color: COLORS.inkSoft }}>{t.desc}</div>
                  </div>
                </div>
                <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: ativo ? COLORS.gas : COLORS.inkSoft }}>{formatBRL(t.preco)}</div>
              </button>
            );
          })}
        </div>

        <Campo label="Quantidade">
          <input type="number" min={1} value={quantidade} onChange={(e) => setQuantidade(Math.max(1, parseInt(e.target.value) || 1))} style={inputStyle()} />
        </Campo>
        <Campo label="Seu nome">
          <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Nome completo" style={inputStyle()} />
        </Campo>
        <Campo label="Telefone">
          <input value={telefone} onChange={(e) => setTelefone(e.target.value)} placeholder="(00) 00000-0000" style={inputStyle()} />
        </Campo>
        <Campo label="Endereço de entrega (opcional)">
          <input value={endereco} onChange={(e) => setEndereco(e.target.value)} placeholder="Rua, número, bairro" style={inputStyle()} />
        </Campo>
        <Campo label="Observações (opcional)">
          <textarea value={observacoes} onChange={(e) => setObservacoes(e.target.value)} rows={3} placeholder="Ponto de referência, horário, etc." style={{ ...inputStyle(), fontFamily: FONT_BODY, resize: "vertical" }} />
        </Campo>

        <Campo label="Forma de pagamento">
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>

                <span style={{ fontFamily: FONT_MONO, fontSize: 13, color: COLORS.ok }}>−{formatBRL(desconto)}</span>

            <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: COLORS.inkSoft, fontWeight: 500 }}>Total estimado</span>

    </div>
  );
}

function LoginScreen({ credenciais, onLogin, onIrCliente }) {
  const [etapa, setEtapa] = useState("senha"); // senha | email | codigo
  const [user, setUser] = useState("");
  const [pass, setPass] = useState("");
  const [verSenha, setVerSenha] = useState(false);
  const [email, setEmail] = useState(EMAILJS.emailNotificacoes);
  const [codigoDigitado, setCodigoDigitado] = useState("");
  const [codigoEnviado, setCodigoEnviado] = useState(null);
  const [enviando, setEnviando] = useState(false);
  const [erro, setErro] = useState("");

  function handleSenha() {
    const u = user.trim();
    const p = pass.trim();
    if (u === credenciais.username && p === credenciais.password) {
      setErro("");
      setEtapa("email");
    } else {
      setErro("Usuário ou senha incorretos.");
    }
  }

  async function handleEnviarCodigo() {
    setErro("");
    const e = email.trim().toLowerCase();
    if (!e.includes("@")) {
      setErro("Digite um e-mail válido.");
      return;
    }
    const codigo = String(Math.floor(100000 + Math.random() * 900000));
    setEnviando(true);
    try {
      await enviarEmail({
        para: e,
        assunto: "Seu código de acesso — Gás & Água",
        mensagem: `Seu código de acesso é: ${codigo}. Ele expira em 10 minutos.`,
        codigo,
      });
      setCodigoEnviado({ codigo, email: e, expira: Date.now() + 10 * 60 * 1000 });
      setEtapa("codigo");
    } catch (err) {
      const detalhe = (err && (err.text || err.message)) ? ` (${err.text || err.message})` : "";
      setErro("Não consegui enviar o e-mail." + detalhe);
    } finally {
      setEnviando(false);
    }
  }

  function handleConfirmarCodigo() {
    if (!codigoEnviado || Date.now() > codigoEnviado.expira) {
      setErro("Código expirado. Envie um novo.");
      return;
    }
    if (codigoDigitado.trim() === codigoEnviado.codigo) {
      onLogin(codigoEnviado.email);
    } else {
      setErro("Código incorreto.");
    }
  }

  return (
    <div style={{ minHeight: "100vh", background: "#000000", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: FONT_BODY }}>
      <div className="scale-in" style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 28 }}>
        <div style={{ width: 40, height: 40, borderRadius: 10, background: COLORS.gas, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>🔥</div>
        <span style={logoTextStyle(22, 10)}>Gás</span>
      </div>

      <div className="fade-in" style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 16, padding: 28, width: "100%", maxWidth: 340 }}>
        {etapa === "senha" ? (
          <div key="senha" className="screen-enter">
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15, color: COLORS.ink, marginBottom: 18 }}>Painel administrativo</div>

            <label style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft, display: "block", marginBottom: 6 }}>Usuário</label>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 14 }}>
              <input value={user} onChange={(e) => setUser(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleSenha()}
                autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false"
                style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 14, flex: 1, background: "transparent", color: COLORS.ink, width: "100%" }}
                placeholder="Usuário" />
            </div>

            <label style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft, display: "block", marginBottom: 6 }}>Senha</label>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 6 }}>
              <input type={verSenha ? "text" : "password"} value={pass} onChange={(e) => setPass(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleSenha()}
                autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false"
                style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 14, flex: 1, background: "transparent", color: COLORS.ink, width: "100%" }}
                placeholder="••••" />
              <button type="button" onClick={() => setVerSenha(!verSenha)} style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkSoft, fontSize: 11, fontFamily: FONT_BODY, fontWeight: 600, whiteSpace: "nowrap" }}>
                {verSenha ? "ocultar" : "mostrar"}
              </button>
            </div>

            {erro && <div className="fade-in" style={{ color: COLORS.warn, fontSize: 12, marginTop: 8, fontWeight: 500 }}>{erro}</div>}

            <button className="btn-anim btn-lift" onClick={handleSenha} style={{ marginTop: 18, width: "100%", background: COLORS.primary, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
              Continuar
            </button>
            <button className="btn-anim" onClick={onIrCliente} style={{ marginTop: 12, width: "100%", background: "transparent", color: COLORS.gas, border: "none", padding: "6px 0", fontFamily: FONT_BODY, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
              🔥 Sou cliente, quero fazer um pedido
            </button>
          </div>
        ) : etapa === "email" ? (
          <div key="email" className="screen-enter">
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15, color: COLORS.ink, marginBottom: 18 }}>Confirme por e-mail</div>
            <label style={{ fontSize: 12, fontWeight: 600, color: COLORS.inkSoft, display: "block", marginBottom: 6 }}>E-mail</label>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 6 }}>
              <input value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleEnviarCodigo()}
                autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false"
                style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 14, flex: 1, background: "transparent", color: COLORS.ink, width: "100%" }}
                placeholder="seu@email.com" />
            </div>
            {erro && <div className="fade-in" style={{ color: COLORS.warn, fontSize: 12, marginTop: 8, fontWeight: 500 }}>{erro}</div>}
            <button className="btn-anim btn-lift" onClick={handleEnviarCodigo} disabled={enviando} style={{ marginTop: 18, width: "100%", background: COLORS.primary, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, cursor: enviando ? "default" : "pointer", opacity: enviando ? 0.6 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              {enviando && <span className="spinner"></span>}
              {enviando ? "Enviando…" : "Enviar código"}
            </button>
          </div>
        ) : (
          <div key="codigo" className="screen-enter">
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15, color: COLORS.ink, marginBottom: 6 }}>Digite o código</div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 16 }}>Enviamos um código para {codigoEnviado?.email}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px", marginBottom: 6 }}>
              <input value={codigoDigitado} onChange={(e) => setCodigoDigitado(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleConfirmarCodigo()}
                autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck="false" inputMode="numeric"
                style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 18, letterSpacing: 4, flex: 1, background: "transparent", color: COLORS.ink, width: "100%", textAlign: "center" }}
                placeholder="000000" maxLength={6} />
            </div>
            {erro && <div className="fade-in" style={{ color: COLORS.warn, fontSize: 12, marginTop: 8, fontWeight: 500 }}>{erro}</div>}
            <button className="btn-anim btn-lift" onClick={handleConfirmarCodigo} style={{ marginTop: 18, width: "100%", background: COLORS.primary, color: "#fff", border: "none", borderRadius: 10, padding: "12px 0", fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
              Entrar
            </button>
            <button className="btn-anim" onClick={() => { setEtapa("email"); setCodigoDigitado(""); setErro(""); }} style={{ marginTop: 10, width: "100%", background: "transparent", color: COLORS.inkSoft, border: "none", padding: "6px 0", fontFamily: FONT_BODY, fontSize: 12, cursor: "pointer" }}>
              Usar outro e-mail
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function Planilha({ vendas }) {
  const totalGeral = vendas.reduce((s, v) => s + v.total, 0);
  const thStyle = { textAlign: "left", padding: "9px 10px", fontFamily: FONT_BODY, fontSize: 11, fontWeight: 700, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: "0.03em", borderBottom: `2px solid ${COLORS.primary}`, whiteSpace: "nowrap" };
  const tdStyle = { padding: "9px 10px", fontFamily: FONT_MONO, fontSize: 13, color: COLORS.ink, whiteSpace: "nowrap" };

  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, overflow: "hidden" }}>
      <div style={{ padding: "14px 16px 10px", display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 14 }}>Planilha de vendas</span>
        <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkSoft }}>{vendas.length} registros · {formatBRL(totalGeral)}</span>
      </div>
      {vendas.length === 0 ? (
        <div style={{ padding: "24px 16px", fontFamily: FONT_BODY, fontSize: 13, color: COLORS.inkSoft }}>Nenhuma venda registrada ainda.</div>
      ) : (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th style={thStyle}>Cliente</th>
                <th style={thStyle}>Qtd</th>
                <th style={thStyle}>Estoque após</th>
                <th style={thStyle}>Valor</th>
                <th style={thStyle}>Data</th>
              </tr>
            </thead>
            <tbody>
              {vendas.map((v, i) => {
                const rowBg = i % 2 === 0 ? COLORS.card : COLORS.paperDim;
                return (
                  <tr key={v.id} style={{ background: rowBg }}>
                    <td style={{ ...tdStyle, fontFamily: FONT_BODY, fontWeight: 600 }}>{v.cliente}</td>
                    <td style={{ ...tdStyle, color: COLORS.gas }}>-{v.quantidade}</td>
                    <td style={{ ...tdStyle, color: COLORS.inkSoft }}>{v.estoqueGasApos}</td>
                    <td style={{ ...tdStyle, fontWeight: 700 }}>{formatBRL(v.total)}</td>
                    <td style={{ ...tdStyle, color: COLORS.inkSoft, fontSize: 12 }}>{formatData(v.data)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function FluxoCaixa({ vendas, despesas, onVoltar, onNovaSaida }) {
  const [periodo, setPeriodo] = useState("7d");

  const vendasP = vendas.filter((v) => dentroDoPeriodo(v.data, periodo));
  const despesasP = despesas.filter((d) => dentroDoPeriodo(d.data, periodo));
  const totalEntradas = vendasP.reduce((s, v) => s + v.total, 0);
  const totalSaidas = despesasP.reduce((s, d) => s + d.valor, 0);
  const saldo = totalEntradas - totalSaidas;

  const movimentos = [
    ...vendasP.map((v) => ({ id: `v-${v.id}`, tipo: "entrada", descricao: `Venda${v.cliente && v.cliente !== "—" ? " — " + v.cliente : ""}`, valor: v.total, data: v.data })),
    ...despesasP.map((d) => ({ id: `d-${d.id}`, tipo: "saida", descricao: d.descricao, valor: d.valor, data: d.data })),
  ].sort((a, b) => new Date(b.data) - new Date(a.data));

  const periodos = [
    { key: "hoje", label: "Hoje" },
    { key: "7d", label: "7 dias" },
    { key: "30d", label: "30 dias" },
    { key: "tudo", label: "Tudo" },
  ];

  return (
    <Painel titulo="Fluxo de caixa" onVoltar={onVoltar}>
      <div style={{ display: "flex", gap: 6, marginBottom: 16, flexWrap: "wrap" }}>
        {periodos.map((p) => (
          <button key={p.key} className="btn-anim" onClick={() => setPeriodo(p.key)} style={{ padding: "6px 12px", borderRadius: 20, border: `1.5px solid ${periodo === p.key ? COLORS.primary : COLORS.border}`, background: periodo === p.key ? COLORS.primary : "transparent", color: periodo === p.key ? "#fff" : COLORS.inkSoft, fontFamily: FONT_BODY, fontWeight: 600, fontSize: 12, cursor: "pointer", transition: "background 0.2s ease, border-color 0.2s ease" }}>
            {p.label}
          </button>
        ))}
      </div>

      <div className="card-row-in" style={{ display: "flex", gap: 8, marginBottom: 16 }}>
        <div style={{ flex: 1, background: COLORS.paperDim, borderRadius: 10, padding: "10px 12px" }}>
          <div style={{ fontFamily: FONT_BODY, fontSize: 10, color: COLORS.inkSoft, fontWeight: 600 }}>ENTRADAS</div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700, color: COLORS.ok }}>{formatBRL(totalEntradas)}</div>
        </div>
        <div style={{ flex: 1, background: COLORS.paperDim, borderRadius: 10, padding: "10px 12px" }}>
          <div style={{ fontFamily: FONT_BODY, fontSize: 10, color: COLORS.inkSoft, fontWeight: 600 }}>SAÍDAS</div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700, color: COLORS.warn }}>{formatBRL(totalSaidas)}</div>
        </div>
        <div style={{ flex: 1, background: saldo >= 0 ? COLORS.ok : COLORS.warn, borderRadius: 10, padding: "10px 12px" }}>
          <div style={{ fontFamily: FONT_BODY, fontSize: 10, color: "rgba(255,255,255,0.8)", fontWeight: 600 }}>SALDO</div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700, color: "#fff" }}>{formatBRL(saldo)}</div>
        </div>
      </div>

      <button className="btn-anim btn-lift" onClick={onNovaSaida} style={{ width: "100%", background: "transparent", border: `1.5px dashed ${COLORS.border}`, borderRadius: 10, padding: "10px 0", fontFamily: FONT_BODY, fontWeight: 600, fontSize: 12, color: COLORS.inkSoft, cursor: "pointer", marginBottom: 16 }}>
        ➖ Registrar saída (despesa)
      </button>

      {movimentos.length === 0 ? (
        <div style={{ padding: "20px 0", textAlign: "center", fontFamily: FONT_BODY, fontSize: 13, color: COLORS.inkSoft }}>Nenhuma movimentação neste período.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {movimentos.map((m) => (
            <div key={m.id} className="fade-in" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", borderRadius: 10, background: COLORS.card, border: `1px solid ${COLORS.border}` }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                <span style={{ fontSize: 14 }}>{m.tipo === "entrada" ? "🔥" : "➖"}</span>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontFamily: FONT_BODY, fontSize: 13, fontWeight: 600, color: COLORS.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{m.descricao}</div>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: COLORS.inkSoft }}>{formatData(m.data)}</div>
                </div>
              </div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 14, fontWeight: 700, color: m.tipo === "entrada" ? COLORS.ok : COLORS.warn, whiteSpace: "nowrap" }}>
                {m.tipo === "entrada" ? "+" : "−"} {formatBRL(m.valor)}
              </div>
            </div>
          ))}
        </div>
      )}
    </Painel>
  );
}

function NovaDespesa({ onVoltar, onConfirmar }) {
  const [descricao, setDescricao] = useState("");
  const [valor, setValor] = useState("");
  const [erro, setErro] = useState("");

  function handleConfirmar() {
    const d = descricao.trim();
    const v = parseFloat(valor);
    if (!d) { setErro("Descreva a saída."); return; }
    if (!v || v <= 0) { setErro("Digite um valor válido."); return; }
    onConfirmar({ descricao: d, valor: v });
    onVoltar();
  }

  return (
    <Painel titulo="Registrar saída" onVoltar={onVoltar}>
      <Campo label="Descrição">
        <input value={descricao} onChange={(e) => setDescricao(e.target.value)} placeholder="Ex: Combustível, manutenção…" style={inputStyle()} />
      </Campo>
      <Campo label="Valor (R$)">
        <input type="number" min={0} step="0.01" value={valor} onChange={(e) => setValor(e.target.value)} placeholder="0,00" style={inputStyle()} />
      </Campo>
      {erro && <div className="fade-in" style={{ color: COLORS.warn, fontSize: 12, marginBottom: 10, fontWeight: 500 }}>{erro}</div>}
      <button className="btn-anim btn-lift" onClick={handleConfirmar} style={confirmBtnStyle()}>Registrar saída</button>
    </Painel>
  );
}

function Painel({ titulo, onVoltar, children }) {
  return (
    <div style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 14, padding: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15 }}>{titulo}</span>
        <button className="icon-btn" onClick={onVoltar} style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkSoft, fontSize: 18 }}>✕</button>
      </div>
      {children}
    </div>
  );
}

function Campo({ label, children }) {
  return (
    <div style={{ marginBottom: 14 }}>

}

function AlterarEstoque({ estoque, onVoltar, onSalvar }) {
  const [gas, setGas] = useState({ qtd: estoque.gas.qtd, capacidade: estoque.gas.capacidade, preco: estoque.gas.preco });
  const [ok, setOk] = useState(false);

  function campoNumero(valor, setFn, campo, min = 0) {
    return (
      <input
        type="number"
        min={min}
        value={valor}
        onChange={(e) => setFn((prev) => ({ ...prev, [campo]: Math.max(min, parseFloat(e.target.value) || 0) }))}
        style={inputStyle()}
      />
    );
  }

  function handleSalvar() {
    onSalvar({
      gas: { ...estoque.gas, qtd: gas.qtd, capacidade: gas.capacidade, preco: gas.preco },
    });
    setOk(true);
    setTimeout(() => setOk(false), 2000);
  }

  return (
    <Painel titulo="Alterar estoque" onVoltar={onVoltar}>
      <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 13, color: COLORS.gas, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>
        🔥 {estoque.gas.nome}
      </div>
      <Campo label="Quantidade em estoque">{campoNumero(gas.qtd, setGas, "qtd")}</Campo>
      <Campo label="Capacidade máxima">{campoNumero(gas.capacidade, setGas, "capacidade", 1)}</Campo>
      <Campo label="Preço unitário (R$)">{campoNumero(gas.preco, setGas, "preco", 0)}</Campo>

      {ok && <div className="fade-in" style={{ color: COLORS.ok, fontSize: 12, marginBottom: 10, fontWeight: 500 }}>✓ Estoque atualizado com sucesso.</div>}

      <button className="btn-anim btn-lift" onClick={handleSalvar} style={confirmBtnStyle()}>Salvar alterações</button>
    </Painel>
  );
}

function AlterarConta({ credenciais, onVoltar, onSalvar }) {
  const [user, setUser] = useState(credenciais.username);
  const [pass, setPass] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [verSenha, setVerSenha] = useState(false);
  const [erro, setErro] = useState("");
  const [ok, setOk] = useState(false);

  function handleSalvar() {
    const u = user.trim();
    const p = pass.trim();
    const c = confirmar.trim();
    if (!u) { setErro("Digite um usuário."); return; }
    if (!p) { setErro("Digite uma senha."); return; }
    if (p !== c) { setErro("As senhas não coincidem."); return; }
    onSalvar({ username: u, password: p });
    setErro("");
    setOk(true);
    setTimeout(() => setOk(false), 2000);
  }

  return (
    <Painel titulo="Alterar usuário e senha" onVoltar={onVoltar}>
      <Campo label="Usuário">
        <input value={user} onChange={(e) => setUser(e.target.value)} style={inputStyle()} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
      </Campo>
      <Campo label="Nova senha">
        <div style={{ display: "flex", alignItems: "center", gap: 8, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 12px" }}>
          <input type={verSenha ? "text" : "password"} value={pass} onChange={(e) => setPass(e.target.value)}
            style={{ border: "none", outline: "none", fontFamily: FONT_MONO, fontSize: 14, flex: 1, background: "transparent", color: COLORS.ink, width: "100%" }}
            autoCapitalize="off" autoCorrect="off" spellCheck="false" />
          <button type="button" onClick={() => setVerSenha(!verSenha)} style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkSoft, fontSize: 11, fontFamily: FONT_BODY, fontWeight: 600, whiteSpace: "nowrap" }}>
            {verSenha ? "ocultar" : "mostrar"}
          </button>
        </div>
      </Campo>
      <Campo label="Confirmar nova senha">
        <input type={verSenha ? "text" : "password"} value={confirmar} onChange={(e) => setConfirmar(e.target.value)} style={inputStyle()} autoCapitalize="off" autoCorrect="off" spellCheck="false" />
      </Campo>

      {erro && <div className="fade-in" style={{ color: COLORS.warn, fontSize: 12, marginBottom: 10, fontWeight: 500 }}>{erro}</div>}
      {ok && <div className="fade-in" style={{ color: COLORS.ok, fontSize: 12, marginBottom: 10, fontWeight: 500 }}>✓ Dados atualizados com sucesso.</div>}

      <button className="btn-anim btn-lift" onClick={handleSalvar} style={confirmBtnStyle()}>Salvar alterações</button>
    </Painel>
  );
}

function Suporte({ onVoltar }) {
  const [mensagem, setMensagem] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [erro, setErro] = useState("");
  const [enviado, setEnviado] = useState(false);

  async function handleEnviar() {
    const m = mensagem.trim();
    if (!m) { setErro("Descreva o problema antes de enviar."); return; }
    setErro("");
    setEnviando(true);
    try {
      await enviarEmail({
        para: EMAILJS.emailNotificacoes,
        assunto: "Suporte — Sistema Gás & Água",
        mensagem: m,
      });
      setEnviado(true);
      setMensagem("");
    } catch (err) {
      const detalhe = (err && (err.text || err.message)) ? ` (${err.text || err.message})` : "";
      setErro("Não consegui enviar." + detalhe);
    } finally {
      setEnviando(false);
    }
  }

  if (enviado) {
    return (
      <Painel titulo="Falar com o suporte" onVoltar={onVoltar}>
        <div className="screen-enter" style={{ textAlign: "center", padding: "20px 0" }}>
          <div className="check-pop" style={{ fontSize: 32, marginBottom: 10 }}>✅</div>
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 600, fontSize: 15, color: COLORS.ink, marginBottom: 6 }}>Mensagem enviada</div>
          <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: COLORS.inkSoft }}>Seu relato foi enviado para o suporte.</div>
        </div>
        <button className="btn-anim btn-lift" onClick={() => setEnviado(false)} style={confirmBtnStyle()}>Enviar outro problema</button>
      </Painel>
    );
  }

  return (
    <Painel titulo="Falar com o suporte" onVoltar={onVoltar}>
      <Campo label="Descreva o problema">
        <textarea value={mensagem} onChange={(e) => setMensagem(e.target.value)} rows={6} placeholder="Conte o que aconteceu..."
          style={{ ...inputStyle(), fontFamily: FONT_BODY, resize: "vertical" }} />
      </Campo>
      {erro && <div className="fade-in" style={{ color: COLORS.warn, fontSize: 12, marginBottom: 10, fontWeight: 500 }}>{erro}</div>}
      <button className="btn-anim btn-lift" onClick={handleEnviar} disabled={enviando} style={{ ...confirmBtnStyle(), opacity: enviando ? 0.6 : 1, cursor: enviando ? "default" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        {enviando && <span className="spinner"></span>}
        {enviando ? "Enviando…" : "Enviar para o suporte"}
      </button>
    </Painel>
  );
}

function App() {
  const [modoEscuro, setModoEscuro] = useState(() => lsGet("gas-agua-tema", false));
  Object.assign(COLORS, modoEscuro ? DARK_COLORS : LIGHT_COLORS);

  function alternarTema() {
    const novo = !modoEscuro;
    setModoEscuro(novo);
    lsSet("gas-agua-tema", novo);
  }

  const [logado, setLogado] = useState(() => !!lsGet("gas-agua-sessao", null));
  const [emailLogado, setEmailLogado] = useState(() => {
    const s = lsGet("gas-agua-sessao", null);
    return s ? s.email : null;
  });
  const [credenciais, setCredenciais] = useState(() => lsGet("gas-agua-auth", DEFAULT_AUTH));
  const [estoque, setEstoque] = useState(() => lsGet("gas-agua-estoque", DEFAULT_ESTOQUE));
  const [vendas, setVendas] = useState(() => lsGet("gas-agua-vendas", []));
  const [despesas, setDespesas] = useState(() => lsGet("gas-agua-despesas", []));
  const [pedidos, setPedidos] = useState(() => lsGet("gas-agua-pedidos", []));
  const [tela, setTela] = useState("historico");
  const [modoTela, setModoTela] = useState("login"); // login | cliente
  const [toast, setToast] = useState(null);
  const [enviandoRelatorio, setEnviandoRelatorio] = useState(false);

  useEffect(() => { lsSet("gas-agua-auth", credenciais); }, []);

  function salvarCredenciais(novas) { setCredenciais(novas); lsSet("gas-agua-auth", novas); }
  function salvarEstoque(novo) { setEstoque(novo); lsSet("gas-agua-estoque", novo); }
  function salvarVendas(novo) { setVendas(novo); lsSet("gas-agua-vendas", novo); }
  function salvarDespesas(novo) { setDespesas(novo); lsSet("gas-agua-despesas", novo); }
  function salvarPedidos(novo) { setPedidos(novo); lsSet("gas-agua-pedidos", novo); }

  function registrarPedidoCliente(dados) {
    const novo = { id: Date.now(), status: "pendente", data: new Date().toISOString(), ...dados };
    salvarPedidos([novo, ...pedidos]);
    return novo;
  }

  function marcarStatusPedido(id, status) {
    salvarPedidos(pedidos.map((p) => (p.id === id ? { ...p, status } : p)));
  }

  function mostrarToast(msg, tipo = "ok") {
    setToast({ msg, tipo });
    setTimeout(() => setToast(null), 2500);
  }

  function registrarVenda({ produto, quantidade, cliente }) {
    const item = estoque[produto];
    if (quantidade > item.qtd) {
      mostrarToast("Estoque insuficiente para essa venda.", "warn");
      return false;
    }
    const total = quantidade * item.preco;
    const estoqueResultante = { ...estoque, [produto]: { ...item, qtd: item.qtd - quantidade } };
    const nova = {
      id: Date.now(),
      produto,
      nomeProduto: item.nome,
      quantidade,
      valorUnit: item.preco,
      total,
      cliente: cliente || "—",
      data: new Date().toISOString(),
      estoqueGasApos: estoqueResultante.gas.qtd,
    };
    salvarVendas([nova, ...vendas]);
    salvarEstoque(estoqueResultante);
    mostrarToast(`Venda registrada: ${formatBRL(total)}`, "ok");

    enviarEmail({
      para: EMAILJS.emailNotificacoes,
      assunto: `Nova venda — ${nova.nomeProduto}`,
      mensagem: `Cliente: ${nova.cliente}\nProduto: ${nova.nomeProduto}\nQuantidade: ${nova.quantidade}\nValor: ${formatBRL(nova.total)}\nEstoque restante — Gás: ${nova.estoqueGasApos}\nData: ${formatData(nova.data)}`,
    }).catch(() => {});

    return true;
  }

  function reporEstoque(produto, quantidade) {
    const item = estoque[produto];
    salvarEstoque({ ...estoque, [produto]: { ...item, qtd: item.qtd + quantidade } });
    mostrarToast("Estoque atualizado.", "ok");
  }

  function registrarDespesa({ descricao, valor }) {
    const nova = { id: Date.now(), descricao, valor, data: new Date().toISOString() };
    salvarDespesas([nova, ...despesas]);
    mostrarToast(`Saída registrada: ${formatBRL(valor)}`, "ok");

    enviarEmail({
      para: EMAILJS.emailNotificacoes,
      assunto: `Nova saída — ${nova.descricao}`,
      mensagem: `Descrição: ${nova.descricao}\nValor: ${formatBRL(nova.valor)}\nData: ${formatData(nova.data)}`,
    }).catch(() => {});
  }

  async function enviarRelatorioDiario(vendasHojeParam, faturamentoHojeParam) {
    setEnviandoRelatorio(true);
    const linhas = vendasHojeParam
      .map((v) => `${v.cliente} — ${v.nomeProduto} × ${v.quantidade} — ${formatBRL(v.total)}`)
      .join("\n");
    try {
      await enviarEmail({
        para: EMAILJS.emailNotificacoes,
        assunto: `Relatório diário — ${new Date().toLocaleDateString("pt-BR")}`,
        mensagem: `Vendas de hoje: ${vendasHojeParam.length}\nFaturamento: ${formatBRL(faturamentoHojeParam)}\n\n${linhas || "Nenhuma venda registrada hoje."}\n\nEstoque atual — Gás: ${estoque.gas.qtd}`,
      });
      mostrarToast("Relatório enviado por e-mail.", "ok");
    } catch (err) {
      mostrarToast("Não consegui enviar o relatório.", "warn");
    } finally {
      setEnviandoRelatorio(false);
    }
  }

  if (modoTela === "cliente") {
    return <ClienteScreen onVoltar={() => setModoTela("login")} onNovoPedido={registrarPedidoCliente} />;
  }

  if (!logado) {
    return <LoginScreen credenciais={credenciais} onLogin={(email) => { setEmailLogado(email); setLogado(true); lsSet("gas-agua-sessao", { email, desde: new Date().toISOString() }); }} onIrCliente={() => setModoTela("cliente")} />;
  }

  const hoje = new Date().toDateString();
  const vendasHoje = vendas.filter((v) => new Date(v.data).toDateString() === hoje);
  const faturamentoHoje = vendasHoje.reduce((s, v) => s + v.total, 0);
  const pedidosPendentes = pedidos.filter((p) => p.status !== "atendido").length;

  return (
    <div style={{ minHeight: "100vh", background: COLORS.paper, fontFamily: FONT_BODY, color: COLORS.ink, paddingBottom: 90 }}>
      <div style={{ padding: "18px 18px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `2px solid ${COLORS.gas}`, background: `linear-gradient(90deg, ${COLORS.gasDim} 0%, ${COLORS.paper} 40%)` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: COLORS.gas, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>🔥</div>
          <span style={logoTextStyle(17, 8)}>Gás</span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="icon-btn btn-anim" onClick={alternarTema} style={{ background: "transparent", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "6px 10px", display: "flex", alignItems: "center", gap: 6, cursor: "pointer", color: COLORS.inkSoft, fontSize: 14 }}>
            <span key={modoEscuro ? "sol" : "lua"} className="scale-in" style={{ display: "inline-block" }}>{modoEscuro ? "☀️" : "🌙"}</span>
          </button>
          <button className="icon-btn btn-anim" onClick={() => setTela("config")} style={{ background: "transparent", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "6px 10px", display: "flex", alignItems: "center", gap: 6, cursor: "pointer", color: COLORS.inkSoft, fontSize: 14 }}>
            ⚙️
          </button>
          <button className="btn-anim" onClick={() => { setLogado(false); setEmailLogado(null); lsRemove("gas-agua-sessao"); }} style={{ background: "transparent", border: `1px solid ${COLORS.border}`, borderRadius: 8, padding: "6px 10px", display: "flex", alignItems: "center", gap: 6, cursor: "pointer", color: COLORS.inkSoft, fontSize: 12, fontFamily: FONT_BODY, fontWeight: 500 }}>
            Sair
          </button>
        </div>
      </div>

      <div style={{ padding: 18, display: "flex", flexDirection: "column", gap: 18 }}>
        <div className="card-row-in" style={{ display: "flex", gap: 12 }}>
          <TankGauge qtd={estoque.gas.qtd} capacidade={estoque.gas.capacidade} color={COLORS.gas} colorDim={COLORS.gasDim} label="Gás" />
        </div>

        <div className="card-row-in" style={{ background: COLORS.primary, borderRadius: 14, padding: "16px 18px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ color: "#B8B2A4", fontSize: 11, fontFamily: FONT_BODY, fontWeight: 500 }}>FATURAMENTO HOJE</div>
            <div style={{ color: "#fff", fontFamily: FONT_MONO, fontSize: 26, fontWeight: 700 }}>{formatBRL(useCountUp(faturamentoHoje))}</div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ color: "#B8B2A4", fontSize: 11, fontFamily: FONT_BODY, fontWeight: 500 }}>VENDAS HOJE</div>
            <div style={{ color: "#fff", fontFamily: FONT_MONO, fontSize: 26, fontWeight: 700 }}>{Math.round(useCountUp(vendasHoje.length))}</div>
          </div>
        </div>

        <button
          className="btn-anim btn-lift"
          onClick={() => enviarRelatorioDiario(vendasHoje, faturamentoHoje)}
          disabled={enviandoRelatorio}
          style={{ background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 10, padding: "10px 0", fontFamily: FONT_BODY, fontWeight: 600, fontSize: 12, color: COLORS.inkSoft, cursor: enviandoRelatorio ? "default" : "pointer", opacity: enviandoRelatorio ? 0.6 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
        >
          {enviandoRelatorio && <span className="spinner spinner-dark"></span>}
          {enviandoRelatorio ? "Enviando…" : "📧 Enviar relatório do dia por e-mail"}
        </button>

        <div key={tela} className="screen-enter" style={{ display: "flex", flexDirection: "column", gap: 18 }}>
          {tela === "historico" && (
            <>
              <div style={{ display: "flex", gap: 10 }}>
                <ActionButton icon="➕" label="Nova venda" onClick={() => setTela("nova-venda")} color={COLORS.gas} />
                <ActionButton icon="📦" label="Repor estoque" onClick={() => setTela("estoque")} color={COLORS.primary} />
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <ActionButton icon="📜" label="Histórico de vendas" onClick={() => setTela("historico-vendas")} color={COLORS.primary} />
                <ActionButton icon="📋" label={pedidosPendentes > 0 ? `Pedidos do app (${pedidosPendentes})` : "Pedidos do app"} onClick={() => setTela("pedidos")} color={COLORS.gas} />
              </div>
              <button className="btn-anim btn-lift" onClick={() => setTela("fluxo")} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, background: COLORS.card, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: "12px 0", cursor: "pointer", color: COLORS.ink, fontFamily: FONT_BODY, fontSize: 12, fontWeight: 600 }}>
                📊 Fluxo de caixa
              </button>
              <Planilha vendas={vendas} />
            </>
          )}

          {tela === "nova-venda" && <NovaVenda estoque={estoque} onVoltar={() => setTela("historico")} onConfirmar={registrarVenda} />}
          {tela === "estoque" && <RepoEstoque estoque={estoque} onVoltar={() => setTela("historico")} onRepor={reporEstoque} />}
          {tela === "fluxo" && <FluxoCaixa vendas={vendas} despesas={despesas} onVoltar={() => setTela("historico")} onNovaSaida={() => setTela("nova-despesa")} />}
          {tela === "nova-despesa" && <NovaDespesa onVoltar={() => setTela("fluxo")} onConfirmar={registrarDespesa} />}
          {tela === "historico-vendas" && <HistoricoVendas vendas={vendas} onVoltar={() => setTela("historico")} />}
          {tela === "pedidos" && <PedidosApp pedidos={pedidos} onVoltar={() => setTela("historico")} onMarcarStatus={marcarStatusPedido} />}
          {tela === "config" && <Configuracoes credenciais={credenciais} estoque={estoque} onVoltar={() => setTela("historico")} onSalvarConta={salvarCredenciais} onSalvarEstoque={salvarEstoque} />}
        </div>
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 20, left: 18, right: 18, animation: "toastSlideIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both", background: toast.tipo === "warn" ? COLORS.warn : COLORS.ok, color: "#fff", borderRadius: 10, padding: "12px 14px", display: "flex", alignItems: "center", gap: 8, fontFamily: FONT_BODY, fontSize: 13, fontWeight: 500, boxShadow: "0 8px 24px rgba(0,0,0,0.18)" }}>
          {toast.tipo === "warn" ? "⚠️" : "✅"} {toast.msg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
